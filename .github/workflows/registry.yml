name: registry

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  registry:
    uses: ./.github/workflows/_run-job.yml
    with:
      role: registry
      timeout-minutes: 45
      max-run-minutes: 35
    secrets: inherit
