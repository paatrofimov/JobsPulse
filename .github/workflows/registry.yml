name: registry

on:
  # Started only by cron-job.org (workflow_dispatch): GitHub's own schedule fires late and irregularly.
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  registry:
    uses: ./.github/workflows/_run-job.yml
    with:
      role: registry
      # A failed run is reported by GitHub's own failure email.
      timeout-minutes: 75
      # Slices are walked until this budget is spent.
      max-run-minutes: 60
    secrets: inherit
