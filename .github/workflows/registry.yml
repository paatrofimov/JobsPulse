name: registry

on:
  # Started only by cron-job.org (workflow_dispatch): GitHub's own schedule fires late and irregularly.
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  registry:
    uses: ./.github/workflows/_run-job.yml
    with:
      role: registry
      # Started by cron-job.org every 6 hours; healthchecks.io alerts after three missed runs.
      cadence-minutes: 360
      timeout-minutes: 75
      # Slices are walked until this budget is spent; with a 6 hour cadence an hour keeps the registry covered.
      max-run-minutes: 60
    secrets: inherit
