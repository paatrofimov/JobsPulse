name: registry

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  registry:
    uses: ./.github/workflows/_run-job.yml
    with:
      role: registry
      # Started by cron-job.org every 30 minutes; healthchecks.io alerts after three missed runs.
      cadence-minutes: 30
      timeout-minutes: 40
      # Slices are walked until this budget is spent; below the 30 minute cadence, so runs do not queue up.
      max-run-minutes: 25
    secrets: inherit
