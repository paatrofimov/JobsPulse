name: digest

on:
  # No `schedule:` - GitHub fires it late and irregularly. cron-job.org dispatches it every 8 hours. A digest covers
  # the time since the previous one; `period-days` is the period of the first digest of a watchlist only.
  workflow_dispatch:
    inputs:
      period-days:
        description: "How many days the first digest of a watchlist covers"
        default: "3"

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    uses: ./.github/workflows/_run-job.yml
    with:
      role: digest
      timeout-minutes: 15
      digest-period-days: ${{ fromJSON(inputs.period-days || '3') }}
    secrets: inherit
