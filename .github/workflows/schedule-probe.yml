name: schedule-probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "event=${{ github.event_name }} actor=${{ github.actor }} at $(date -u)"
