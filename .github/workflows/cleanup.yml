name: cleanup

on:
  # Started only by cron-job.org (workflow_dispatch): GitHub's own schedule fires late and irregularly.
  workflow_dispatch:

jobs:
  cleanup:
    uses: ./.github/workflows/_run-job.yml
    with:
      role: cleanup
      # Started by cron-job.org every day; healthchecks.io alerts after three missed runs.
      cadence-minutes: 1440
      timeout-minutes: 15
    secrets: inherit
