# Builds the host and runs one `--role <job>` iteration. Called by the scheduled workflows next to it.
name: run-job

on:
  workflow_call:
    inputs:
      role:
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 30
      max-run-minutes:
        type: number
        default: 0

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # healthchecks.io dead man's switch, one check per role (`jobspulse-<role>`). Empty until the secret is set.
      HC_URL: ${{ secrets.HEALTHCHECKS_PING_KEY && format('https://hc-ping.com/{0}/jobspulse-{1}', secrets.HEALTHCHECKS_PING_KEY, inputs.role) || '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # A start signal lets healthchecks tell a hung job (started, never finished) from one that never ran.
      - name: Signal start
        if: env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "$RUN_URL" "$HC_URL/start?create=1" || true

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'NuGet.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet publish src/JobsPulse.Host -c Release -o out

      - name: Run ${{ inputs.role }}
        working-directory: out
        run: dotnet JobsPulse.Host.dll --role ${{ inputs.role }}
        env:
          DOTNET_ENVIRONMENT: Production
          ConnectionStrings__Postgres: ${{ secrets.POSTGRES }}
          Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          Telegram__EnableCommands: "false"
          WatchlistPolling__DryRun: ${{ vars.POLLING_DRY_RUN || 'false' }}
          RegistryPolling__DryRun: ${{ vars.REGISTRY_DRY_RUN || 'false' }}
          Job__MaxRunMinutes: ${{ inputs.max-run-minutes }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.role }}-${{ github.run_id }}
          path: out/logs/
          retention-days: 3
          if-no-files-found: ignore

      # Success pings the check, anything else (a failed step, a cancel, the job timeout) reports a failure at once.
      - name: Signal result
        if: always() && env.HC_URL != ''
        run: |
          suffix=$([ "${{ job.status }}" = "success" ] && echo "" || echo "/fail")
          curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "${{ job.status }}: $RUN_URL" "$HC_URL$suffix?create=1" || true
