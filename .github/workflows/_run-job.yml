# Builds the host and runs one `--role <job>` iteration. Called by the scheduled workflows next to it.
name: run-job

on:
  workflow_call:
    inputs:
      role:
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 30
      max-run-minutes:
        type: number
        default: 0
      # How often the job is started; healthchecks.io alerts after three cadences without a run. 0 - no heartbeat.
      cadence-minutes:
        type: number
        default: 0

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Secrets cannot be tested in a step condition, their presence can.
      HC_ENABLED: ${{ secrets.HEALTHCHECKS_API_KEY != '' && inputs.cadence-minutes > 0 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'NuGet.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet publish src/JobsPulse.Host -c Release -o out

      - name: Run ${{ inputs.role }}
        working-directory: out
        # exec: dotnet replaces the shell, so a cancel or the job timeout reaches it as SIGINT/SIGTERM and the job stops
        # gracefully (checkpoints written). Under bash it was orphaned and killed outright.
        run: exec dotnet JobsPulse.Host.dll --role ${{ inputs.role }}
        env:
          DOTNET_ENVIRONMENT: Production
          ConnectionStrings__Postgres: ${{ secrets.POSTGRES }}
          Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          Telegram__EnableCommands: "false"
          WatchlistPolling__DryRun: ${{ vars.POLLING_DRY_RUN || 'false' }}
          RegistryPolling__DryRun: ${{ vars.REGISTRY_DRY_RUN || 'false' }}
          Job__MaxRunMinutes: ${{ inputs.max-run-minutes }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.role }}-${{ github.run_id }}
          path: out/logs/
          retention-days: 3
          if-no-files-found: ignore

      # A dead man's switch, not a failure alert: every finished run - failed ones too, GitHub emails those - resets
      # the check, and healthchecks.io emails only when no run has happened for three cadences (cron-job.org or
      # GitHub stopped starting the job). The check is upserted with that schedule, so it is configured here.
      - name: Report the run to healthchecks.io
        if: always() && env.HC_ENABLED == 'true'
        env:
          HC_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
          CHECK: jobspulse-${{ inputs.role }}
          CADENCE: ${{ inputs.cadence-minutes }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(jq -n --arg name "$CHECK" --argjson cadence "$CADENCE" \
            '{name: $name, slug: $name, timeout: ($cadence * 60), grace: ($cadence * 120), unique: ["name"], channels: "*"}')
          ping_url=$(curl -fsS -m 20 --retry 3 -X POST https://healthchecks.io/api/v3/checks/ \
            -H "X-Api-Key: $HC_API_KEY" -H 'Content-Type: application/json' -d "$body" | jq -r .ping_url) || true
          if [ -n "$ping_url" ] && [ "$ping_url" != null ]; then
            curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "$STATUS: $RUN_URL" "$ping_url" || true
          else
            echo "::warning::healthchecks.io check $CHECK could not be upserted"
          fi
