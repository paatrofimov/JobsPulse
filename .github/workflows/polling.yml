name: polling

on:
  schedule:
    # Hourly, off the top of the hour: GitHub delays and drops scheduled runs at :00 under load.
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  group: polling
  cancel-in-progress: false

jobs:
  polling:
    uses: ./.github/workflows/_run-job.yml
    with:
      role: polling
      # Started by cron-job.org every 60 minutes; healthchecks.io alerts after three missed runs.
      cadence-minutes: 60
      timeout-minutes: 60
      max-run-minutes: 50
    secrets: inherit
