name: polling

on:
  # Started only by cron-job.org (workflow_dispatch): GitHub's own schedule fires late and irregularly.
  workflow_dispatch:

concurrency:
  group: polling
  cancel-in-progress: false

jobs:
  polling:
    uses: ./.github/workflows/_run-job.yml
    with:
      role: polling
      # Started by cron-job.org every 3 hours; healthchecks.io alerts after three missed runs.
      cadence-minutes: 180
      timeout-minutes: 60
      max-run-minutes: 50
    secrets: inherit
