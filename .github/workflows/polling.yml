name: polling

on:
  # Started only by cron-job.org (workflow_dispatch): GitHub's own schedule fires late and irregularly.
  workflow_dispatch:

concurrency:
  group: polling
  cancel-in-progress: false

jobs:
  polling:
    uses: ./.github/workflows/_run-job.yml
    with:
      role: polling
      # Started by cron-job.org every 6 hours; a failed run is reported by GitHub's own failure email.
      timeout-minutes: 60
      max-run-minutes: 50
    secrets: inherit
