# Builds the image, deploys the Telegram webhook host to Cloud Run and points Telegram at it.
name: deploy-bot

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/deploy-bot.yml"
  workflow_dispatch:

concurrency:
  group: deploy-bot
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'europe-west3' }}
  SERVICE: jobspulse-bot
  REPOSITORY: jobspulse

jobs:
  deploy:
    # Skipped until the Google Cloud project is configured, so a merge before the setup does not fail.
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure the image repository exists
        run: |
          gcloud artifacts repositories describe "$REPOSITORY" --location="$REGION" --project="$PROJECT_ID" \
            || gcloud artifacts repositories create "$REPOSITORY" --repository-format=docker \
                 --location="$REGION" --project="$PROJECT_ID"

      - name: Build and push the image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/host:${{ github.sha }}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          image: ${{ env.IMAGE }}
          # Scale to zero between messages; one instance at most, so the in-memory dialogue state is not split.
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=1
            --cpu=1
            --memory=512Mi
            --timeout=60
            --args=--role,webhook
          env_vars: |-
            DOTNET_ENVIRONMENT=Production
            ConnectionStrings__Postgres=${{ secrets.POSTGRES }}
            Telegram__BotToken=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TelegramWebhook__SecretToken=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
            GitHubDispatch__Token=${{ secrets.GH_DISPATCH_TOKEN }}

      - name: Register the webhook and the command menu
        run: |
          docker run --rm \
            -e DOTNET_ENVIRONMENT=Production \
            -e ConnectionStrings__Postgres \
            -e Telegram__BotToken \
            -e TelegramWebhook__SecretToken \
            -e TelegramWebhook__PublicUrl \
            "$IMAGE" --role webhooksetup
        env:
          ConnectionStrings__Postgres: ${{ secrets.POSTGRES }}
          Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TelegramWebhook__SecretToken: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TelegramWebhook__PublicUrl: ${{ steps.deploy.outputs.url }}
